name: Dynamic Environment Deploy

on:
  push:
    branches:
      - 'feature/**'
  delete:

jobs:
  deploy:
    runs-on: self-hosted
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set namespace name
        run: |
          $branch = "${{ github.ref_name }}"
          $namespace = $branch -replace '/', '-'
          $namespace = $namespace.ToLower()
          echo "NAMESPACE=$namespace" >> $env:GITHUB_ENV
          Write-Host "Namespace will be: $namespace"
        shell: powershell

      - name: Start Minikube if not running
        run: |
          $status = minikube status --format='{{.Host}}' 2>$null
          if ($status -ne "Running") {
            minikube start
          } else {
            Write-Host "Minikube already running"
          }
        shell: powershell

      - name: Create namespace
        run: |
          kubectl create namespace $env:NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          Write-Host "Namespace $env:NAMESPACE ready"
        shell: powershell

      - name: Deploy to namespace
        run: |
          $repoPath = "${{ github.workspace }}"
          kubectl apply -f "$repoPath\app\k8s\base\deployment.yaml" -n $env:NAMESPACE
          kubectl apply -f "$repoPath\app\k8s\base\service.yaml" -n $env:NAMESPACE
          kubectl apply -f "$repoPath\app\k8s\base\ingress.yaml" -n $env:NAMESPACE
        shell: powershell

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/test-env -n $env:NAMESPACE --timeout=60s
        shell: powershell

      - name: Get service URL
        run: |
          $nodePort = kubectl get service test-env-service -n $env:NAMESPACE -o jsonpath='{.spec.ports[0].nodePort}'
          $minikubeIp = minikube ip
          Write-Host "✅ Environment URL: http://${minikubeIp}:${nodePort}"
        shell: powershell

  cleanup:
    runs-on: self-hosted
    if: github.event_name == 'delete'

    steps:
      - name: Set namespace name
        run: |
          $branch = "${{ github.event.ref }}"
          $namespace = $branch -replace '/', '-'
          $namespace = $namespace.ToLower()
          echo "NAMESPACE=$namespace" >> $env:GITHUB_ENV
          Write-Host "Deleting namespace: $namespace"
        shell: powershell

      - name: Delete namespace
        run: |
          kubectl delete namespace $env:NAMESPACE --ignore-not-found
          Write-Host "✅ Namespace $env:NAMESPACE deleted successfully"
        shell: powershell